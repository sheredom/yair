name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    # run fmt to verify we have no non-formatted syntax
    - run: rustup component add rustfmt
    - run: cargo fmt -- --check --color always
    
    # run clippy to verify we have no warnings
    - run: rustup component add clippy
    - run: cargo clippy --lib --tests -- -D warnings

    # make sure cargo deny does not result in any errors
    - run: cargo install cargo-deny --locked
    - run: cargo deny check -W unmaintained

  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: cargo fetch
        uses: actions-rs/cargo@v1
        with:
          command: fetch
      - name: cargo publish
        uses: actions-rs/cargo@v1
        with:
          command: publish
          args: --dry-run

  test-no-default-features:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v2
    - name: Test
      run: cargo test --no-default-features

  test-yalang-feature:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v2
    - name: Test
      run: cargo test --features=yalang

  test-llvm-feature:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install LLVM 22
      run: |
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh 22
        sudo apt-get install -y llvm-22-dev zlib1g-dev libzstd-dev libncurses-dev
        echo "YAIR_LLVM_INSTALL_DIR=/usr/lib/llvm-22" >> "$GITHUB_ENV"
        echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
    - run: cargo test --features llvm

  benchmark:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install LLVM 22
      run: |
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh 22
        sudo apt-get install -y llvm-22-dev zlib1g-dev libzstd-dev libncurses-dev
        echo "YAIR_LLVM_INSTALL_DIR=/usr/lib/llvm-22" >> "$GITHUB_ENV"
        echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
    - run: rustup toolchain install nightly
      # The sed here is to remove double : which the action doesn't account for it seems!
    - run: cargo +nightly bench --features="yalang,llvm,nightly" | sed 's/::/__/g' | tee benchmark_output.txt
    - name: Store benchmark result
      if: github.event_name == 'push'
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Rust Benchmark on ubuntu-latest
        tool: 'cargo'
        output-file-path: benchmark_output.txt
        # Use personal access token instead of GITHUB_TOKEN due to https://github.community/t5/GitHub-Actions/Github-action-not-triggering-gh-pages-upon-push/td-p/26869/highlight/false
        github-token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        auto-push: true
  
  benchmark-other:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install LLVM 22
      run: |
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh 22
        sudo apt-get install -y llvm-22-dev zlib1g-dev libzstd-dev libncurses-dev
        echo "YAIR_LLVM_INSTALL_DIR=/usr/lib/llvm-22" >> "$GITHUB_ENV"
        echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
    - run: cargo build --release --bins --features="yalang,llvm"
    - run: cargo run --example benchmarks --release --features="yalang,llvm" | tee benchmark_output.txt
    - name: Store benchmark result
      if: github.event_name == 'push'
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Other benchmarks for ubuntu-latest
        tool: 'customSmallerIsBetter'
        output-file-path: benchmark_output.txt
        # Use personal access token instead of GITHUB_TOKEN due to https://github.community/t5/GitHub-Actions/Github-action-not-triggering-gh-pages-upon-push/td-p/26869/highlight/false
        github-token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        auto-push: true
